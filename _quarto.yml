project:
  type: book
  output-dir: _book
  # Re-paginates the rendered HTML so each section gets its own page (see the
  # header of the script). Output-only: it never touches a .qmd, computes no
  # numbers, and is idempotent — remove this line and re-render to undo it.
  post-render:
    - split-sections.py
  # Interactive widgets are standalone HTML pages under widgets/<chapter>/ and are
  # pulled into the book with an <iframe>. Quarto only copies files it knows about,
  # so the folder has to be declared here or the iframes 404 in _book/.
  resources:
    - widgets/**

book:
  title: "חשבון דיפרנציאלי ואינטגרלי 1 להנדסה"
  site-url: "https://bguteachingcenter.github.io/BGU-Calculus-Book"
  subtitle: "טיוטה — מבוססת על מחברת ההרצאות, כתיב גולמי לעריכה"
  author: "יובל חצ׳טריאן-רזיאל"
  output-file: "Book_Draft"
  search: true
  reader-mode: true
  # Puts a download button in the sidebar tools of every page, pointing at
  # _book/Book_Draft.pdf. The file only exists after a PDF render — an
  # HTML-only render leaves whatever PDF is already there, so it can go stale.
  downloads: [pdf]
  chapters:
    - index.qmd
    - part: part-1-foundations.qmd
      chapters:
        - 01-logic.qmd
        - 02-sets.qmd
        - 03-number-systems.qmd
        - 04-abs-value.qmd
        - 05-induction.qmd
    - part: "חלק 2: סדרות"
      chapters:
        - 06-sequences-intro.qmd
        - 07-sequences-limit.qmd
        - 08-sequences-properties.qmd
        - 09-sequences-infinity.qmd
    - part: "חלק 3: מבוא לפונקציות"
      chapters:
        - 10-functions-intro.qmd
    - part: "חלק 4: גבולות של פונקציות"
      chapters:
        - 11-function-limits.qmd
    - part: "חלק 5: רציפות"
      chapters:
        - 12-continuity.qmd
    - part: "חלק 6: הנגזרת"
      chapters:
        - 13-derivative.qmd
    - part: "חלק 7: שימושים של הנגזרת"
      chapters:
        - 14-derivative-applications.qmd
    - part: "חלק 8: נגזרות מסדר גבוה וחקירת פונקציות"
      chapters:
        - 15-higher-derivatives.qmd
    - part: "חלק 9: האינטגרל הלא-מסוים"
      chapters:
        - 16-indefinite-integral.qmd
    - part: "חלק 10: האינטגרל המסוים"
      chapters:
        - 17-definite-integral.qmd
    - part: "חלק 11: האינטגרל המוכלל"
      chapters:
        - 18-improper-integral.qmd

lang: he
dir: rtl
number-sections: true
number-depth: 2

crossref:
  chapters: true
  def-title: "הגדרה"
  exm-title: "דוגמה"
  thm-title: "משפט"
  prp-title: "טענה"

language:
  crossref-prp-prefix: "טענה"

filters:
  - theorem-numbering.lua
  - quarto

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 4
    toc-title: "תוכן העניינים"
    toc-expand: true
    code-fold: true
    include-in-header: _styles.html
  pdf:
    pdf-engine: xelatex
    keep-tex: true
    include-in-header:
      text: |
        % Quarto renders callouts as an `enhanced` tcolorbox, which is broken in
        % RTL (bidi): a diagonal line appears and every page after it shifts left.
        % Render callout content as a plain block instead. (HTML is unaffected.)
        \AtBeginDocument{\renewenvironment{tcolorbox}[1][]{\par\smallskip}{\par\smallskip}}
        % In RTL (babel bidi=basic), hyperref colored links bleed their blue color
        % and clickable box across the whole line. Turn link coloring off in the PDF
        % (links still work/navigate; they just render as normal black text).
        \AtBeginDocument{\hypersetup{hidelinks}}
        % Math inside an UNNUMBERED heading: Quarto emits a bare \addcontentsline
        % carrying the raw math (no \texorpdfstring), and hyperref then tries to turn
        % it into a PDF-bookmark string. Under unicode-math \pi is \mitpi — a
        % \Umathchardef token — which errors with "Improper alphabetic constant".
        % Give hyperref plain-text stand-ins for the math that can show up there.
        \AtBeginDocument{%
          \pdfstringdefDisableCommands{%
            \def\({}\def\){}%
            \def\,{}\def\;{}\def\!{}\def\quad{ }\def\qquad{ }%
            \def\pi{π}\def\varepsilon{ε}\def\epsilon{ε}\def\delta{δ}%
            \def\alpha{α}\def\beta{β}\def\gamma{γ}\def\lambda{λ}%
            \def\theta{θ}\def\sigma{σ}\def\varphi{φ}\def\infty{∞}%
            \def\to{→}\def\leq{≤}\def\geq{≥}\def\neq{≠}%
            \def\mathbb#1{#1}\def\mathrm#1{#1}\def\mathbf#1{#1}\def\text#1{#1}%
            \def\frac#1#2{#1/#2}\def\dfrac#1#2{#1/#2}%
            \def\sqrt#1{√(#1)}%
          }%
        }
        % optional-reading blocks: a coloured label, deliberately NOT a framed box
        % (framed/tcolorbox environments re-trigger the RTL breakage above).
        % .foldable blocks: collapsed in HTML, but print cannot fold — so show them and
        % flag them as skippable. Rules, not a frame (framed envs break RTL, see above).
        \definecolor{foldaccent}{HTML}{64748B}
        % Every coloured piece sits in its own \parbox. In an RTL paragraph XeTeX reverses
        % each line, colour push/pop specials included, so a bare {\color{..}..} inline can
        % emit the pop BEFORE the push: the colour never switches off, and the rest of the
        % book prints in it (found 2026-09-24: everything after §8.6's proof came out orange).
        \newenvironment{foldablebox}[1]{\par\medskip\noindent\parbox{\linewidth}{\color{foldaccent}\rule{\linewidth}{0.6pt}}\par\smallskip\noindent\parbox{\linewidth}{\color{foldaccent}\bfseries #1\ \mdseries(אפשר לדלג)}\par\smallskip}{\par\smallskip\noindent\parbox{\linewidth}{\color{foldaccent}\rule{\linewidth}{0.6pt}}\par\medskip}
        \definecolor{optionalaccent}{HTML}{6B7280}
        \newenvironment{optionalbox}[1]{\par\medskip\noindent\parbox{\linewidth}{\color{optionalaccent}\rule{\linewidth}{1.2pt}}\par\smallskip\noindent\parbox{\linewidth}{\color{optionalaccent}\bfseries #1}\par\smallskip}{\par\smallskip\noindent\parbox{\linewidth}{\color{optionalaccent}\rule{\linewidth}{1.2pt}}\par\medskip}
        % העשרה (.extra): same shape as optionalbox, orange like the HTML edition (2026-09-24).
        \definecolor{extraaccent}{HTML}{C2410C}
        \newenvironment{extrabox}[1]{\par\medskip\noindent\parbox{\linewidth}{\color{extraaccent}\rule{\linewidth}{1.2pt}}\par\smallskip\noindent\parbox{\linewidth}{\color{extraaccent}\bfseries #1}\par\smallskip}{\par\smallskip\noindent\parbox{\linewidth}{\color{extraaccent}\rule{\linewidth}{1.2pt}}\par\medskip}
    mainfont: Arial
    sansfont: Arial
    monofont: "Courier New"
    mathfont: "XITSMath-Regular.otf"
    code-overflow: wrap
    geometry:
      - margin=2.5cm

jupyter: python3
