<script>
/* MathJax 4 breaks long INLINE math across lines by default (new in v4 — v3 only ever
   broke display math). That is what splits $.M > 0$ into ".M" on one line and "> 0" on
   the next. It cannot be fixed in CSS: MathJax inserts real break points into its own
   DOM, so white-space:nowrap has nothing to collapse.

   In this book it is worse than untidy. Each fragment becomes its own LTR bidi isolate
   inside RTL prose, so the halves can surface in the wrong visual order, and the
   book's convention of keeping the closing punctuation inside the math ($.M > 0$) can
   leave that period stranded on a line of its own.

   Display math still breaks, which is what we want for a formula wider than the column.
   This must be set before mathjax@4/tex-chtml.js loads; _styles.html is pulled in via
   include-in-header and lands far above the (deferred) script tag. */
window.MathJax = {
  chtml: {
    linebreaks: { inline: false }
  }
};

/* Math inside an RTL page. The document is <html dir="rtl">, so both Quarto's
   .math wrapper and MathJax's own container inherit direction:rtl, and math with
   more than one token comes out mirrored: (L-ε, L+ε) renders as )L+ε, L-ε(, and
   ⌊m⌋ ≤ m < ⌊m⌋+1 reverses too. Give every math run its own LTR bidi context.
   Single-symbol math ($L$, $\varepsilon$) cannot show the fault, which is why it
   surfaces in figure captions — that is where the intervals and the chained
   inequalities are. The PDF is unaffected; xelatex already boxes math LTR. */

  direction: ltr;
  unicode-bidi: isolate;

   the math ($.a_n \le b_n$) — that period must never be orphaned onto the next line.

<script>
document.addEventListener("DOMContentLoaded", function () {
  document.querySelectorAll(".tf-quiz").forEach(function (quiz) {
    var correct = quiz.getAttribute("data-correct");
    var feedback = quiz.querySelector(".tf-feedback");
    quiz.querySelectorAll(".tf-opt").forEach(function (btn) {
      btn.addEventListener("click", function () {
        quiz.querySelectorAll(".tf-opt").forEach(function (b) {
          b.classList.remove("correct", "incorrect");
        });
        if (btn.getAttribute("data-val") === correct) {
          btn.classList.add("correct");
          if (feedback) feedback.textContent = "✓ נכון!";
        } else {
          btn.classList.add("incorrect");
          if (feedback) feedback.textContent = "✗ לא מדויק — נסו שוב, או פתחו את הפתרון.";
        }
        /* Opt-in via a bare data-reveal attribute: answering opens the solution that
           follows, so the reasoning appears once the reader has committed. Quizzes
           without the attribute (chapter 1) are untouched.
           Located by document order, NOT by id: a Div carrying an identifier together
           with .thmsol .foldable crashes Quarto's own main.lua ("attempt to index a
           nil value (field 'attr')"). Either attribute alone is fine; only the
           combination breaks, so the solution boxes deliberately have no id. */
        if (quiz.hasAttribute("data-reveal")) {
          var box = null;
          for (var node = quiz; node && node.tagName !== "MAIN" && !box; node = node.parentElement) {
            for (var sib = node.nextElementSibling; sib && !box; sib = sib.nextElementSibling) {
              box = sib.tagName === "DETAILS" ? sib
                  : (sib.querySelector ? sib.querySelector("details") : null);
            }
          }
          if (box) box.open = true;
        }
      });
    });
  });
});
</script>
<script>
/* .bound-quiz — for "give SOME bound" questions, where there is no single right
   answer. Unlike .seq-quiz (exact match), it accepts ANY number on the correct side
   of a threshold: data-atleast="35/2" accepts every M >= 35/2, data-atmost="16"
   every m <= 16. Arithmetic is allowed in the input, so "35/2" and "17.5" both pass.
   The point of the exercise is that a bound need not be optimal, so a widget that
   demanded the optimal one would contradict the question. */
document.addEventListener("DOMContentLoaded", function () {
  function evalNum(s) {
    s = String(s || "").trim();
    if (!s) return null;
    if (!/^[0-9+\-*/^().\s]+$/.test(s)) return null;      /* digits and operators only */
    try {
      var v = Function('"use strict"; return (' + s.replace(/\^/g, "**") + ');')();
      return (typeof v === "number" && isFinite(v)) ? v : null;
    } catch (e) { return null; }
  }
  document.querySelectorAll(".bound-quiz").forEach(function (q) {
    var atLeast = evalNum(q.getAttribute("data-atleast"));
    var atMost  = evalNum(q.getAttribute("data-atmost"));
    var input = q.querySelector(".seq-input");
    var feedback = q.querySelector(".seq-feedback");
    var btn = q.querySelector(".seq-check");
    function check() {
      input.classList.remove("correct", "incorrect");
      var v = evalNum(input.value);
      if (v === null) {
        input.classList.add("incorrect");
        if (feedback) feedback.textContent = "✗ נא להזין מספר";
        return;
      }
      var ok = (atLeast !== null) ? v >= atLeast : v <= atMost;
      input.classList.add(ok ? "correct" : "incorrect");
      if (feedback) {
        feedback.textContent = ok ? "✓ נכון! כל חסם מתאים מתקבל."
          : (atLeast !== null ? "✗ יש איברים בסדרה הגדולים מהמספר הזה."
                              : "✗ יש איברים בסדרה הקטנים מהמספר הזה.");
      }
    }
    if (btn) btn.addEventListener("click", check);
    if (input) input.addEventListener("keydown", function (e) { if (e.key === "Enter") check(); });
  });
});
</script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  function normSet(str) {
    if (!str) return [];
    return Array.from(new Set(
      str.split(/[\s,;]+/).filter(function (s) { return s.length; }).map(Number)
    )).filter(function (n) { return !Number.isNaN(n); }).sort(function (a, b) { return a - b; });
  }
  function eqSet(a, b) {
    if (a.length !== b.length) return false;
    for (var i = 0; i < a.length; i++) { if (a[i] !== b[i]) return false; }
    return true;
  }
  document.querySelectorAll(".set-quiz").forEach(function (q) {
    var answer = normSet(q.getAttribute("data-answer"));
    var input = q.querySelector(".set-input");
    var feedback = q.querySelector(".set-feedback");
    var btn = q.querySelector(".set-check");
    function check() {
      input.classList.remove("correct", "incorrect");
      if (eqSet(normSet(input.value), answer)) {
        input.classList.add("correct");
        if (feedback) feedback.textContent = "✓ נכון!";
      } else {
        input.classList.add("incorrect");
        if (feedback) feedback.textContent = "✗ נסו שוב";
      }
    }
    if (btn) btn.addEventListener("click", check);
    if (input) input.addEventListener("keydown", function (e) { if (e.key === "Enter") check(); });
  });
});
</script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  // Evaluate one entered term as arithmetic (whitelisted chars only: digits + - * / ^ ( ) . )
  function evalTerm(s) {
    s = String(s).trim();
    if (!s) return null;
    if (!/^[0-9+\-*/^().\s]+$/.test(s)) return null;
    try {
      var v = Function('"use strict"; return (' + s.replace(/\^/g, "**") + ');')();
      return (typeof v === "number" && isFinite(v)) ? v : null;
    } catch (e) { return null; }
  }
  function parseSeq(str) { return String(str || "").split(",").map(evalTerm); }
  function eqSeq(a, b) {
    if (a.length !== b.length) return false;
    for (var i = 0; i < a.length; i++) {
      if (a[i] == null || b[i] == null || Math.abs(a[i] - b[i]) > 1e-9) return false;
    }
    return true;
  }
  document.querySelectorAll(".seq-quiz").forEach(function (q) {
    var answer = parseSeq(q.getAttribute("data-answer"));
    var input = q.querySelector(".seq-input");
    var feedback = q.querySelector(".seq-feedback");
    var btn = q.querySelector(".seq-check");
    function check() {
      input.classList.remove("correct", "incorrect");
      if (eqSeq(parseSeq(input.value), answer)) {
        input.classList.add("correct");
        if (feedback) feedback.textContent = "✓ נכון!";
      } else {
        input.classList.add("incorrect");
        if (feedback) feedback.textContent = "✗ נסו שוב";
      }
    }
    if (btn) btn.addEventListener("click", check);
    if (input) input.addEventListener("keydown", function (e) { if (e.key === "Enter") check(); });
  });
});
</script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  // Inscribed regular n-gon in the unit circle: area a_n = (n/2)*sin(2*pi/n) -> pi
  document.querySelectorAll(".pi-demo").forEach(function (demo) {
    var slider = demo.querySelector(".pi-demo-slider");
    var poly = demo.querySelector(".pi-demo-poly");
    var polyOut = demo.querySelector(".pi-demo-poly-out");
    // Two instances of this widget appear in the chapter: the first shows only the
    // inscribed polygon (the circumscribed one has not been motivated yet), the second
    // shows both. Which one is decided by data-show-out, not by a control — a checkbox
    // there would give away the second half of the argument.
    var showOutward = demo.getAttribute("data-show-out") === "1";
    var outRow = demo.querySelector(".pi-demo-out-row");
    var bandRow = demo.querySelector(".pi-demo-band-row");
    var kOut = demo.querySelector(".pi-demo-k");
    var nOut = demo.querySelector(".pi-demo-n");
    var aOut = demo.querySelector(".pi-demo-area");
    var aOutC = demo.querySelector(".pi-demo-area-out");
    var bOut = demo.querySelector(".pi-demo-band");
    var dOut = demo.querySelector(".pi-demo-diff");
    if (slider && poly) {
      var update = function () {
        var kIdx = parseInt(slider.value, 10);                 // the slider value IS k (1..10)
        var n = 6 * Math.pow(2, kIdx - 1);                     // n_k = 6,12,24,...,3072
        var R = 1 / Math.cos(Math.PI / n);   // circumradius of the circumscribed n-gon (apothem 1)
        var pts = [], ptsOut = [];
        for (var k = 0; k < n; k++) {
          var t = -Math.PI / 2 + 2 * Math.PI * k / n;   // start at the top
          pts.push(Math.cos(t).toFixed(5) + "," + Math.sin(t).toFixed(5));
          // the circumscribed polygon is tangent at the inscribed polygon's vertices,
          // so its own vertices sit half a step further round, at radius R
          var u = t + Math.PI / n;
          ptsOut.push((R * Math.cos(u)).toFixed(5) + "," + (R * Math.sin(u)).toFixed(5));
        }
        poly.setAttribute("points", pts.join(" "));
        if (polyOut) polyOut.setAttribute("points", ptsOut.join(" "));
        var area = (n / 2) * Math.sin(2 * Math.PI / n);
        var areaOut = n * Math.tan(Math.PI / n);
        if (polyOut) polyOut.style.display = showOutward ? "" : "none";
        if (outRow) outRow.style.display = showOutward ? "" : "none";
        if (bandRow) bandRow.style.display = showOutward ? "" : "none";
        if (kOut) kOut.textContent = kIdx;
        if (nOut) nOut.textContent = n;
        if (aOut) aOut.textContent = area.toFixed(6);
        if (aOutC) aOutC.textContent = areaOut.toFixed(6);
        // the gaps shrink by ~4 per step, so they need more digits than the areas
        if (bOut) bOut.textContent = (areaOut - area).toFixed(8);
        if (dOut) dOut.textContent = (Math.PI - area).toFixed(8);
      };
      slider.addEventListener("input", update);
      update();
    }
  });

  // Build n -> value from a formula in n (whitelisted: digits, n, + - * / ^ ! ( ) . )
  function makeFormula(s) {
    s = String(s || "").trim();
    if (!s || !/^[0-9n+\-*/^!().\s]+$/.test(s)) return null;
    s = s.replace(/(\d)\s*([n(])/g, "$1*$2")             // 2n, 2(  -> 2*n, 2*(
         .replace(/([n)])\s*([n(])/g, "$1*$2")           // )n, )(, n(  -> insert *
         .replace(/(\([^()]*\)|\d+|n)!/g, "fact($1)")    // n!, 5!, (n+1)!  -> fact(...)
         .replace(/\^/g, "**");
    try {
      var f = Function("n", '"use strict"; var fact=function(k){k=Math.round(k);var r=1;for(var i=2;i<=k;i++)r*=i;return r;}; return (' + s + ");");
      var t = f(1);
      return (typeof t === "number" && isFinite(t)) ? f : null;
    } catch (e) { return null; }
  }
  function parseTargets(str) {
    return String(str || "").split(",").map(function (t) {
      t = t.trim();
      if (!/^-?[0-9]+(?:\/[0-9]+)?$/.test(t)) return NaN;
      var p = t.split("/");
      return p.length === 2 ? Number(p[0]) / Number(p[1]) : Number(p[0]);
    });
  }
  document.querySelectorAll(".formula-quiz").forEach(function (q) {
    var targets = parseTargets(q.getAttribute("data-answer"));
    var input = q.querySelector(".seq-input");
    var feedback = q.querySelector(".seq-feedback");
    var btn = q.querySelector(".seq-check");
    function check() {
      input.classList.remove("correct", "incorrect");
      var f = makeFormula(input.value), ok = !!f;
      for (var i = 0; ok && i < targets.length; i++) {
        var v; try { v = f(i + 1); } catch (e) { ok = false; break; }
        if (typeof v !== "number" || !isFinite(v) || Math.abs(v - targets[i]) > 1e-9) ok = false;
      }
      if (ok) {
        input.classList.add("correct");
        if (feedback) feedback.textContent = "✓ נכון!";
      } else {
        input.classList.add("incorrect");
        if (feedback) feedback.textContent = "✗ נסו שוב";
      }
    }
    if (btn) btn.addEventListener("click", check);
    if (input) input.addEventListener("keydown", function (e) { if (e.key === "Enter") check(); });
  });
});
</script>
<script>
// Widgets embedded from widgets/<chapter>/ report their own height, so the
// iframe does not need a hard-coded one (which breaks on narrow screens,
// where the control panel stacks above the plot).
window.addEventListener("message", function (e) {
  var d = e.data;
  if (!d || d.type !== "widget-height" || typeof d.height !== "number") return;
  var frames = document.querySelectorAll("iframe.widget-frame");
  for (var i = 0; i < frames.length; i++) {
    if (frames[i].contentWindow === e.source) {
      frames[i].style.height = Math.max(320, Math.min(2000, d.height)) + "px";
      return;
    }
  }
});
</script>
