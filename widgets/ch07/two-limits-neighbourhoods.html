<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>שתי סביבות ברדיוס d/2</title>
<link rel="stylesheet" href="../shared/seq-limit.css">
<style>
/* Widget-specific bits only; the rest comes from seq-limit.css so this reads as
   the same artwork as the chapter-7 widgets and the chapter's static figures. */
.axis{stroke:#1f2937;stroke-width:1.4}
.tick{stroke:#1f2937;stroke-width:1.8}
.guide{stroke:#1f2937;stroke-width:.8;stroke-dasharray:2 3;opacity:.7}
.pt{stroke:#fff;stroke-width:1.5}
.lbl{font-family:"Times New Roman",Times,serif;font-style:italic;font-size:17px;
     text-anchor:middle}
.dimlbl{font-family:"Times New Roman",Times,serif;font-style:italic;font-size:14px;
        text-anchor:middle}
.expr{font-family:"Times New Roman",Times,serif;font-style:italic;font-size:1.05rem;
      direction:ltr;unicode-bidi:isolate}
.caseline{margin-top:.6rem;text-align:center}
.verdict{margin-top:.4rem;text-align:center;font-weight:700}
.v1{color:var(--blue)} .v2{color:var(--red)} .v0{color:var(--key)}
</style>
</head>
<body>
<div class="demo">

<svg id="plot" viewBox="0 0 640 215" role="img"
     aria-label="ישר מספרים ובו שני גבולות, כל אחד עם סביבה ברדיוס חצי מהמרחק ביניהם, ונקודה נעה"></svg>

<div class="row">
  <span class="key">מיקום הנקודה <span class="expr">x</span></span>
  <input id="xr" type="range" min="0" step="1"
         aria-label="הזזת הנקודה x על הישר">
</div>

<div class="caseline"><span class="expr" id="caseExpr"></span></div>

<div class="readout">
  <div><span class="expr" id="cmp1"></span></div>
  <div><span class="expr" id="cmp2"></span></div>
</div>

<div class="verdict" id="verdict"></div>

</div>

<script>
(function (global) {
  "use strict";

  // Palette. Read once from the shared stylesheet and kept as literal strings:
  // var() does NOT resolve inside SVG presentation attributes set via setAttribute,
  // so passing "var(--blue)" there silently yields black.
  var css = getComputedStyle(document.documentElement);
  function cssvar(name, fallback) {
    var s = css.getPropertyValue(name).trim();
    return s || fallback;
  }
  var INK   = cssvar("--ink",  "#1f2937");
  var BLUE  = cssvar("--blue", "#1f4e79");
  var RED   = cssvar("--red",  "#c0392b");
  var GREEN = "#2e7d32";

  // Model coordinates. d = 2, so d/2 = 1 and the picture divides evenly.
  var L1 = -1, L2 = 1, d = L2 - L1, h = d / 2, m = (L1 + L2) / 2;

  // The slider runs a full d beyond each limit, NOT merely to the edge of the
  // neighbourhoods: otherwise the midpoint would be the only reachable point lying
  // outside both, which invites the false converse "every point is near one of them".
  var XMIN = L1 - d, XMAX = L2 + d;

  // Discrete steps, chosen so every landmark is exactly reachable: 48 steps across a
  // range of 4d gives a step of d/8, and L1-d/2, L1, the midpoint, L2 and L2+d/2 all
  // fall on whole steps. The midpoint matters most — it is the one position outside
  // BOTH neighbourhoods, and on a continuous slider it was effectively unhittable.
  var STEPS = 48;

  // A little wider than the reachable range, so end labels are not clipped.
  var VMIN = XMIN - 0.4, VMAX = XMAX + 0.4;
  var PX0 = 40, PX1 = 600, BASE = 140;
  var SVGNS = "http://www.w3.org/2000/svg";

  function sx(v) { return PX0 + (v - VMIN) * (PX1 - PX0) / (VMAX - VMIN); }

  var svg = document.getElementById("plot");
  var dyn = document.createElementNS(SVGNS, "g");   // rebuilt on every update

  function make(parent, name, attrs, text) {
    var n = document.createElementNS(SVGNS, name);
    for (var k in attrs) { if (attrs[k] !== undefined) n.setAttribute(k, attrs[k]); }
    if (text !== undefined) n.textContent = text;
    parent.appendChild(n);
    return n;
  }

  // A measurement bar: a rule with a short tick at each end, plus a label above it.
  // Preferred over arrowheads — no marker defs to duplicate once per colour.
  function dim(parent, x1, x2, y, colour, label) {
    if (Math.abs(sx(x1) - sx(x2)) > 1) {
      make(parent, "line", { x1: sx(x1), y1: y, x2: sx(x2), y2: y,
                             stroke: colour, "stroke-width": 1.4 });
      [x1, x2].forEach(function (v) {
        make(parent, "line", { x1: sx(v), y1: y - 4, x2: sx(v), y2: y + 4,
                               stroke: colour, "stroke-width": 1.4 });
      });
    }
    make(parent, "text", { x: (sx(x1) + sx(x2)) / 2, y: y - 7, fill: colour,
                           "class": "dimlbl" }, label);
  }

  // ---------- static layer ----------

  [L1, L2].forEach(function (v) {                       // guides up to the d bar
    make(svg, "line", { x1: sx(v), y1: BASE - 9, x2: sx(v), y2: 38, "class": "guide" });
  });
  dim(svg, L1, L2, 38, INK, "d");

  make(svg, "rect", { x: sx(L1 - h), y: BASE - 8, width: sx(L1 + h) - sx(L1 - h),
                      height: 16, fill: BLUE, opacity: 0.20 });
  make(svg, "rect", { x: sx(L2 - h), y: BASE - 8, width: sx(L2 + h) - sx(L2 - h),
                      height: 16, fill: RED, opacity: 0.20 });

  make(svg, "line", { x1: 16, y1: BASE, x2: 624, y2: BASE, "class": "axis" });

  // the midpoint: the single place the two neighbourhoods touch
  make(svg, "line", { x1: sx(m), y1: BASE - 11, x2: sx(m), y2: BASE + 11, "class": "tick" });

  make(svg, "circle", { cx: sx(L1), cy: BASE, r: 5.5, fill: BLUE, "class": "pt" });
  make(svg, "circle", { cx: sx(L2), cy: BASE, r: 5.5, fill: RED,  "class": "pt" });
  make(svg, "text", { x: sx(L1), y: 166, fill: BLUE, "class": "lbl" }, "L₁");
  make(svg, "text", { x: sx(L2), y: 166, fill: RED,  "class": "lbl" }, "L₂");

  // radii measured outward, so the middle stays clear — same choice as the static figure
  dim(svg, L1 - h, L1, 190, BLUE, "d/2");
  dim(svg, L2, L2 + h, 190, RED,  "d/2");

  svg.appendChild(dyn);                                  // dynamic layer sits on top

  // ---------- dynamic layer ----------

  var slider  = document.getElementById("xr");
  slider.max   = STEPS;
  slider.value = 11;                       // starts inside L₁'s neighbourhood
  var caseEl  = document.getElementById("caseExpr");
  var cmp1El  = document.getElementById("cmp1");
  var cmp2El  = document.getElementById("cmp2");
  var verdict = document.getElementById("verdict");

  var EPS = 1e-9;
  function cmp(a, b) { return a < b - EPS ? "<" : (a > b + EPS ? ">" : "="); }

  function reportHeight() {
    requestAnimationFrame(function () {
      if (global.parent && global.parent !== global) {
        global.parent.postMessage({
          type: "widget-height",
          height: Math.ceil(document.documentElement.scrollHeight)
        }, "*");
      }
    });
  }

  function update() {
    var x  = XMIN + (slider.value / STEPS) * (XMAX - XMIN);
    var d1 = Math.abs(x - L1), d2 = Math.abs(x - L2);

    while (dyn.firstChild) { dyn.removeChild(dyn.firstChild); }

    dim(dyn, Math.min(x, L2), Math.max(x, L2),  68, RED,  "|x − L₂|");
    dim(dyn, Math.min(x, L1), Math.max(x, L1), 100, BLUE, "|x − L₁|");

    make(dyn, "circle", { cx: sx(x), cy: BASE, r: 5.5, fill: GREEN, "class": "pt" });
    make(dyn, "text", { x: sx(x), y: 126, fill: GREEN, "class": "lbl" }, "x");

    // Which of the chapter's three cases holds — shown as the relation, not as numbers.
    if (x < L1 - EPS) {
      caseEl.textContent = "|x − L₂| = d + |x − L₁|";
    } else if (x > L2 + EPS) {
      caseEl.textContent = "|x − L₁| = d + |x − L₂|";
    } else {
      caseEl.textContent = "|x − L₁| + |x − L₂| = d";
    }

    cmp1El.textContent = "|x − L₁| " + cmp(d1, h) + " d/2";
    cmp2El.textContent = "|x − L₂| " + cmp(d2, h) + " d/2";

    if (Math.abs(x - m) < EPS) {
      // The midpoint is the whole point of the picture: distance exactly d/2 to each,
      // so the strict inequality excludes it from both.
      verdict.textContent = "בדיוק באמצע: המרחק אל L₁ ואל L₂ שווה d/2, ולכן x מחוץ לשתי הסביבות";
      verdict.className = "verdict v0";
    } else if (d1 < h - EPS) {
      verdict.textContent = "x נמצאת בסביבה של L₁ בלבד";
      verdict.className = "verdict v1";
    } else if (d2 < h - EPS) {
      verdict.textContent = "x נמצאת בסביבה של L₂ בלבד";
      verdict.className = "verdict v2";
    } else {
      verdict.textContent = "x מחוץ לשתי הסביבות";
      verdict.className = "verdict v0";
    }

    reportHeight();
  }

  slider.addEventListener("input", update);
  global.addEventListener("resize", reportHeight);
  update();
})(window);
</script>
</body>
</html>
