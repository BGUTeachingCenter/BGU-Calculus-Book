<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>התכנסות: aₙ = (3n−4)/(n+2)</title>
<link rel="stylesheet" href="../shared/seq-limit.css">
</head>
<body>
<div id="app"></div>
<script src="../shared/seq-limit.js"></script>
<script>
SeqLimit.mount({
  f: function (n) { return (3 * n - 4) / (n + 2); },
  L: 3,
  eps: { min: 0.001, max: 1, def: 0.3 },
  scanMax: 30000
});
</script>
</body>
</html>
